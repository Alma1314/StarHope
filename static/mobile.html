<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StarHope 手机互联</title><link rel="stylesheet" href="/mobile.css"></head>
<body><main><header><p>STARHOPE · 安卓互联</p><h1>把题目拍给电脑</h1><p>手机与电脑连接同一个可信 Wi-Fi，电脑保持题库开启。</p></header>
<p id="status" role="status" aria-live="polite"></p>
<section id="pairPanel"><h2>连接电脑</h2><form id="pairForm"><label for="code">电脑端显示的八位配对码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" required><button disabled>配对连接</button></form><p>请在电脑的「手机互联」中开启连接。配对码十分钟有效。</p></section>
<div id="connected" hidden><nav aria-label="手机功能"><button id="photoTab" aria-pressed="true">拍照录入</button><button id="bankTab" aria-pressed="false">共享题库</button><button id="disconnect">断开</button></nav>
<section id="photoPanel"><h2>拍照录入</h2><p>拍清完整题干与选项。每次传送一张，电脑确认后调用 OCR 校对并保存。已做题目也可在电脑学习档案中分析。</p>
<div class="actions"><label class="button" for="camera">打开后置相机</label><input id="camera" class="file-input" type="file" accept="image/*" capture="environment"><label class="button secondary" for="album">从相册选择</label><input id="album" class="file-input" type="file" accept="image/*"></div>
<img id="preview" alt="待传送照片预览" hidden><p id="photoInfo"></p><button id="send" disabled>传给电脑</button><p>传送成功后照片保留在电脑收件箱，关闭互联不删除；请在电脑校对。未成功时可原样重试，不重复收件。HTTP 仅用于可信局域网，请勿映射到公网。</p><ol id="receipts" aria-label="本页传送记录"></ol></section>
<section id="bankPanel" hidden><h2>共享电脑题库</h2><p>实时读取电脑的题文与答案，点击刷新查看电脑新保存的题目。</p><form id="searchForm"><label for="query">题目关键词</label><input id="query" maxlength="200" type="search"><button>搜索 / 刷新</button></form><p id="bankSummary"></p><div id="questions"></div><div class="actions"><button id="prev">上一页</button><button id="next">下一页</button></div></section></div>
</main><script src="/mobile.js"></script></body></html>
