# Single source of truth for StarHope dependencies (PEP 621).
# Runtime pins are exact and include transitive dependencies.
# Verify updates with: python -m pip check && python -m pytest tests/

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "starhope"
description = "StarHope local math question bank"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "sqlalchemy==2.0.51",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "pillow==13.0.0",
    "python-docx==1.2.0",
    "lxml==6.1.1",
    "defusedxml==0.7.1",
    "olefile==0.47",
    "exceptiongroup==1.3.1",
    "sniffio==1.3.1",
    "pymupdf==1.28.2",
    "pdf-inspector==1.26.1",
    "sqlite-vec==0.1.9",
    "cozo-embedded==0.7.6",
    "pycozo==0.7.6",
    # Locked transitive runtime dependencies.
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "click==8.4.2",
    "colorama==0.4.6",
    "greenlet==3.5.4",
    "h11==0.16.0",
    "idna==3.18",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "starlette==1.6.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.3",
    "urllib3==2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "httpx2==2.7.0",
    "httpcore2==2.7.0",
    "truststore==0.10.4",
    "iniconfig==2.3.0",
    "packaging==26.3",
    "pluggy==1.6.0",
    "pygments==2.20.0",
]

[tool.setuptools.dynamic]
version = { attr = "starhope.__version__" }

[tool.setuptools.packages.find]
include = ["starhope*"]
